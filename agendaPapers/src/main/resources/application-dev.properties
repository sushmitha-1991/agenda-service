spring.application.name=configclient

#Config server URL
spring.config.import=optional:configserver:https://dspuser:admin123@dsptest.sansad.in

#Server port
server.port:8085

#Log configuration
logging.level.root=INFO

#spring.kafka.consumer.group-id=group_id
spring.kafka.consumer.group-id=eSummonGroup

# Kafka Topic Name (custom variable if needed)
kafka.topic.eSummon=esummon-topic

# Kafka properties
# Consumer config
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=true
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# Producer config
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.bootstrap-servers=10.247.128.22:9092

patternlogging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n