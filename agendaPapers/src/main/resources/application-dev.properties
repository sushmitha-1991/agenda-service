spring.application.name=configclient

#Config server URL
spring.config.import=optional:configserver:https://dspuser:admin123@dsptest.sansad.in
server.port=8085
master.service.url=https://dsptest.sansad.in/master
#Feign client properties
feign.client.bearer.name=bearerClient
feign.client.bearer.url=https://dsptest.sansad.in
application.instance.service.url=https://dsptest.sansad.in/master/application-instances
template.service.url=https://dsptest.sansad.in/master/templates

#Kafka properties

#spring.kafka.consumer.group-id=group_id
spring.kafka.consumer.group-id=eSummonGroup
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=true
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.bootstrap-servers=10.247.128.22:9092

# Kafka Topic Name (custom variable if needed)
kafka.topic.eSummon=esummon-topic1


