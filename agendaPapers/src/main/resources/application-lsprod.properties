spring.config.import=optional:configserver:${CONFIG_SERVER_URL}
spring.application.name=configclient
server.port=8080

#Feign client properties
feign.client.bearer.name=${feign_client_bearer_name}
feign.client.bearer.url=${BASE_DOMAIN_URL}

application.instance.service.url=${BASE_DOMAIN_URL}/dsp2/api/master/application-instances
template.service.url=${BASE_DOMAIN_URL}/dsp2/api/master/templates
master.service.url=${BASE_DOMAIN_URL}/dsp2/api/master
#Log configuration
logging.level.root=INFO


spring.kafka.consumer.group-id=${spring_kafka_consumer_group-id}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=true
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

#producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.bootstrap-servers=${spring_kafka_bootstrap-servers}
kafka.topic.eSummon=${kafka_topic_eSummon}


# External API URL for generating PDF
external.api.url=${BASE_DOMAIN_URL}/dsp2/api/template
# Feign client configuration
feign.client.pdf.name=pdfClient
feign.client.pdf.url=${external.api.url}

packagelogging.level.com.dsp.agendaPapers.summonNotification.service.impl=DEBUG
patternlogging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
