spring.application.name=configclient

#Config server URL
spring.config.import=optional:configserver:https://dspuser:admin123@dspstg.sansad.in
server.port=8085

#Feign client properties
feign.client.bearer.name=bearerClient
feign.client.bearer.url=https://dspstg.sansad.in

application.instance.service.url=https://dspstg.sansad.in/master/application-instances
template.service.url=https://dspstg.sansad.in/master/templates
master.service.url=https://dspstg.sansad.in/master
#Log configuration
logging.level.root=INFO

##Kafka properties
#spring.kafka.consumer.group-id=group_id
#spring.kafka.consumer.auto-offset-reset=earliest
#spring.kafka.consumer.enable-auto-commit=true

spring.kafka.consumer.group-id=eSummonGroup
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=true

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

#producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.kafka.bootstrap-servers=10.247.128.22:9092
# Kafka Topic Name
# Kafka Topic Name (custom variable if needed)
kafka.topic.eSummon=esummon-topicstg


# External API URL for generating PDF
external.api.url=https://dspstg.sansad.in/template
# Feign client configuration
feign.client.pdf.name=pdfClient
feign.client.pdf.url=${external.api.url}

packagelogging.level.com.dsp.agendaPapers.summonNotification.service.impl=DEBUG
patternlogging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

pdf.upload.url=https://dspstg.sansad.in/template/upload-html-english