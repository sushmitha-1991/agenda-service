springdoc.api-docs.path=/agendapapers/v3/api-docs
springdoc.swagger-ui.path=/agendapapers/swagger-ui.html
openKm.dsp1.download.endpoint=https://dspstg.sansad.in/dms/openkm/dsp1/downloads/
